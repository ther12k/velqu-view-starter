[package]
name = "velqu-view-starter"
description = "External-consumer starter app for VelquView: the gate-transaction operations workflow, standalone."
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

# VelquView runtime pin (corrective-2). The short id 8f6f87d is the
# framework's post-closure correction 0003 commit ("batched model echo
# write-backs corrupt live editing"), which also carries correction 0002
# (reactive profile hardening + initial-turn reload acceptance); both are
# linked from the framework's Phase-1 closure record
# (docs/evidence/phase1-closure.md in the framework repository). The
# previous pin 1d0a562 carried both defects. The dev tool (velqu-lab,
# via dev.sh) is pinned SEPARATELY at 3c1ee34 — see README.md's revision
# table.
[dependencies]
velqu-view = { git = "https://github.com/ther12k/velqu-view.git", rev = "8f6f87d54dc5b43c1e56795eb84d246e2749f887" }

# The application host owns its window loop (src/window.rs): the
# operations workflow must observe public events so a Save click can
# reach host-side persistence — velqu-shell's run() deliberately drops
# the event batch. Same public crates the framework shell uses.
winit = "0.30"
softbuffer = "0.4"
arboard = "3"

# Host-side persistence (records.json): an application-host concern,
# explicitly not part of the renderer.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "0.38", default-features = false, features = ["fs"] }

# Diagnostic examples only (examples/*_probe.rs); not used by the app.
# velqu-shell rides the SAME framework revision as the runtime pin
# (corrective-2); the watch-defect probes' historical evidence at
# 1d0a562 lives in docs/verification.md §3, not in the probes' current
# behavior.
[dev-dependencies]
velqu-shell = { git = "https://github.com/ther12k/velqu-view.git", rev = "8f6f87d54dc5b43c1e56795eb84d246e2749f887" }
notify = "8.2.0"
